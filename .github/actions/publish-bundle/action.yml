name: Publish content bundle
description: >
  Publish the content-bundle artifact to one site target: assume the
  target's role via OIDC, write the latest bundle and a dated immutable
  snapshot under content/, then invalidate the bundle's CDN path. The
  calling job needs id-token: write.

inputs:
  role:
    description: ARN of the role to assume (scoped to content/ writes and invalidations)
    required: true
  bucket:
    description: Site bucket name
    required: true
  dist:
    description: CloudFront distribution id
    required: true
  region:
    description: AWS region
    required: false
    default: us-east-1

runs:
  using: composite
  steps:
    # Actions pinned by full commit SHA per the supply-chain review. The
    # comment after the ref names the tag the SHA belongs to.
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      with:
        name: content-bundle

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
      with:
        role-to-assume: ${{ inputs.role }}
        aws-region: ${{ inputs.region }}

    - name: Publish bundle (latest and dated snapshot)
      shell: bash
      env:
        BUCKET: ${{ inputs.bucket }}
      run: |
        STAMP=$(date -u +%Y%m%dT%H%M%SZ)
        aws s3 cp content-bundle.json "s3://${BUCKET}/content/content-bundle.json" \
          --cache-control "no-cache" --content-type "application/json"
        aws s3 cp content-bundle.json "s3://${BUCKET}/content/snapshots/content-bundle-${STAMP}-${GITHUB_SHA::7}.json" \
          --cache-control "public, max-age=31536000, immutable" --content-type "application/json"

    - name: Invalidate CDN path
      shell: bash
      env:
        DIST: ${{ inputs.dist }}
      run: |
        aws cloudfront create-invalidation \
          --distribution-id "${DIST}" \
          --paths "/content/content-bundle.json" \
          --query "Invalidation.Id" --output text
