name: Build and publish

# On every merge to main: build content-bundle.json once and publish it to
# each site target's content origin, then invalidate each target's CDN path.
# The site fetches the bundle at page load, so a merged change is visible
# within minutes without any site rebuild.
#
# Auth is OIDC-federated: for each target the workflow assumes an AWS role
# scoped to writing the content/ prefix and creating invalidations. No
# long-lived credentials are stored in this repository.
#
# Targets. During the move of the site to its new AWS account the bundle is
# published to both accounts (a dual-write; see the main repo's
# epoch-ops/TODOS_Phase2.md, decision D9). Each target is its own job that
# calls .github/actions/publish-bundle. The required target's failure fails
# the run; the optional target has continue-on-error, so its failure is
# shown on the run but does not fail it. At cutover the continue-on-error
# moves to the phase-1 job; at the end the phase-1 job is deleted.
#
# Repository variables:
#   phase-1 site (account 409410541898), required:
#     AWS_ROLE_ARN                      the publish role
#     CONTENT_BUCKET                    the site bucket name
#     CLOUDFRONT_DIST_ID                the distribution id
#   VerifyCardano site (account 527490776074), optional; the job is skipped
#   until VERIFYCARDANO_CONTENT_BUCKET is set:
#     VERIFYCARDANO_ROLE_ARN            ContentPublishRoleArn stack output
#     VERIFYCARDANO_CONTENT_BUCKET      verifycardano-site-527490776074
#     VERIFYCARDANO_CLOUDFRONT_DIST_ID  DistributionId stack output

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token is required by aws-actions/configure-aws-credentials to mint the
# OIDC token; contents: read is needed to check the repo out. Nothing else
# is granted.
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by full commit SHA per the supply-chain review. The
      # comment after the ref names the tag the SHA belongs to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Assert bundle uses only allowlisted tags
        # Belt-and-braces: the build already sanitizes. This blocks the
        # publish before it starts if the invariant ever regresses.
        run: node scripts/assert-bundle-tags.mjs

      # Built once and shared, so every target receives byte-identical
      # bundles (the bundle carries its own generated_at timestamp).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: content-bundle
          path: content-bundle.json
          if-no-files-found: error
          retention-days: 7

  publish-phase1:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Checkout only to make the local publish-bundle action available.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/publish-bundle
        with:
          role: ${{ vars.AWS_ROLE_ARN }}
          bucket: ${{ vars.CONTENT_BUCKET }}
          dist: ${{ vars.CLOUDFRONT_DIST_ID }}

  publish-verifycardano:
    needs: build
    if: vars.VERIFYCARDANO_CONTENT_BUCKET != ''
    # Optional during the dual-write: a failure here is reported but does
    # not fail the run.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      # Checkout only to make the local publish-bundle action available.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/publish-bundle
        with:
          role: ${{ vars.VERIFYCARDANO_ROLE_ARN }}
          bucket: ${{ vars.VERIFYCARDANO_CONTENT_BUCKET }}
          dist: ${{ vars.VERIFYCARDANO_CLOUDFRONT_DIST_ID }}
