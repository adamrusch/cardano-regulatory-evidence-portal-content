name: Build and publish

# On every merge to main: build content-bundle.json, publish it to the
# VerifyCardano site's content origin, then invalidate its CDN path.
# The site fetches the bundle at page load, so a merged change is visible
# within minutes without any site rebuild.
#
# Auth is OIDC-federated: the workflow assumes an AWS role scoped to writing
# the content/ prefix and creating invalidations. No long-lived credentials
# are stored in this repository.
#
# The publish job calls .github/actions/publish-bundle and is deliberately
# unconditional: if a variable below goes missing, the publish fails rather
# than being skipped.
#
# Repository variables (VerifyCardano site, account 527490776074):
#   VERIFYCARDANO_ROLE_ARN            ContentPublishRoleArn stack output
#   VERIFYCARDANO_CONTENT_BUCKET      verifycardano-site-527490776074
#   VERIFYCARDANO_CLOUDFRONT_DIST_ID  DistributionId stack output

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token is required by aws-actions/configure-aws-credentials to mint the
# OIDC token; contents: read is needed to check the repo out. Nothing else
# is granted.
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by full commit SHA per the supply-chain review. The
      # comment after the ref names the tag the SHA belongs to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Assert bundle uses only allowlisted tags
        # Belt-and-braces: the build already sanitizes. This blocks the
        # publish before it starts if the invariant ever regresses.
        run: node scripts/assert-bundle-tags.mjs

      # Handed to the publish job as an artifact.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: content-bundle
          path: content-bundle.json
          if-no-files-found: error
          retention-days: 7

  publish-verifycardano:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Checkout only to make the local publish-bundle action available.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/publish-bundle
        with:
          role: ${{ vars.VERIFYCARDANO_ROLE_ARN }}
          bucket: ${{ vars.VERIFYCARDANO_CONTENT_BUCKET }}
          dist: ${{ vars.VERIFYCARDANO_CLOUDFRONT_DIST_ID }}
