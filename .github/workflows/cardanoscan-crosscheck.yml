# Fetches a short list of URLs on a GitHub-hosted runner (the analysis
# sandbox has no egress to Cardano data hosts) so a Koios-derived figure can
# be cross-checked against independent sources. Intended for public JSON
# APIs; cardanoscan.io itself bot-blocks datacenter fetches behind a
# Cloudflare challenge, which this workflow does not attempt to evade.
# URLs are listed one per line in analysis/crosscheck_urls.txt; raw
# responses are committed under analysis/data/crosscheck/ for local parsing.
# [skip ci] on the data commit prevents retriggering.

name: Cross-check fetch

on:
  push:
    branches: [claude/cardano-pool-production-analysis-m9r5fv]
    paths:
      - "analysis/crosscheck_urls.txt"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch listed URLs
        run: |
          mkdir -p analysis/data/crosscheck
          rm -f analysis/data/crosscheck/*
          i=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            i=$((i+1))
            echo "fetching [$i] $url"
            curl -sSL --max-time 60 -H "Accept: application/json" \
              -o "analysis/data/crosscheck/page$i.out" "$url" || echo "FAILED $url"
            echo "$url" > "analysis/data/crosscheck/page$i.url"
            sleep 2
          done < analysis/crosscheck_urls.txt

      - name: Commit responses to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/data/crosscheck
          git commit -m "Add cross-check responses [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
