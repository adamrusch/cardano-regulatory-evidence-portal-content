# Temporary data-collection workflow for the stake-pool block-production
# analysis on this branch. GitHub-hosted runners have ordinary internet
# egress, so the Koios public API is fetched here and the resulting dataset
# is committed back to the same branch for the analysis to consume.
#
# This workflow is scoped to the analysis branch and is not part of the
# portal's publishing pipeline. It triggers on pushes to the analysis branch
# (workflow_dispatch is unavailable for workflows that do not exist on the
# default branch); the dataset commit it makes carries [skip ci] so it does
# not retrigger itself.

name: Koios data fetch

on:
  push:
    branches: [claude/cardano-pool-production-analysis-m9r5fv]
    paths:
      - "analysis/koios_fetch.py"
      - ".github/workflows/koios-data-fetch.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch dataset from Koios
        run: |
          mkdir -p analysis/data
          python analysis/koios_fetch.py

      - name: Commit dataset to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/data/koios_dataset.json.gz
          git commit -m "Add Koios dataset snapshot [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
