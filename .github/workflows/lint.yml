name: Lint

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. Every step here is read-only; the build and
# publish workflow is where write scopes live.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by full commit SHA per the supply-chain review. The
      # comment after the ref names the tag the SHA belongs to so a human
      # reviewer can cross-check without re-resolving the pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Markdown lint
        run: npm run lint:md

      - name: Frontmatter validation and bundle dry run
        run: npm run lint:frontmatter

      - name: Build bundle
        # The build step is what actually renders each fragment; it is
        # already exercised on every merge by the publish workflow, but
        # running it in lint means a shape or sanitizer failure blocks the
        # PR instead of the publish.
        run: node scripts/build-bundle.mjs

      - name: Assert bundle uses only allowlisted tags
        run: node scripts/assert-bundle-tags.mjs

      - name: Prose style rules (Vale)
        uses: errata-ai/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a  # v2
        with:
          # STYLEGUIDE.md is excluded: it enumerates the forbidden forms as
          # examples, which the style rules would flag.
          files: '["faq", "docs", "metrics", "README.md", "CONTRIBUTING.md", "GOVERNANCE.md"]'
          fail_on_error: true

      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2
        with:
          args: --no-progress --exclude-path node_modules "faq/**/*.md" "docs/**/*.md" "*.md"
          fail: true
